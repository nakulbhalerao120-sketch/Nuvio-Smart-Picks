name: Build and publish verified Nuvio v2 TV beta
on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/tv-beta.yml', 'release/tv-custom.patch', 'release/tv-sync.py']
permissions:
  contents: read
concurrency:
  group: nuvio-v2-tv-beta
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      code: ${{ steps.pick.outputs.code }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release/tv-sync.py
  build:
    needs: select
    if: needs.select.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.select.outputs.tag }}
      CODE: ${{ needs.select.outputs.code }}
      VERSION: ${{ needs.select.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          set -euo pipefail
          git init -q upstream
          cd upstream
          repo=https://github.com/NuvioMedia/NuvioTV.git
          git fetch --depth=1 "$repo" 77cc0bb5f42f55c5e3877fc4d57a7df510c3f42b
          git fetch --depth=1 "$repo" "refs/tags/$TAG"
          git checkout --detach FETCH_HEAD
          git apply --3way ../release/tv-custom.patch
          git apply ../release/tv-live.patch
          sed -Ei "s/^([[:space:]]*versionCode = )[0-9]+/\1$CODE/;s/^([[:space:]]*versionName = ).*/\1\"$VERSION\"/" app/build.gradle.kts
          curl -fsSL --retry 3 https://api.nuvio.tv/.well-known/nuvio > "$RUNNER_TEMP/service.json"
          key=$(jq -er 'select((.backend_url|rtrimstr("/"))=="https://api.nuvio.tv") | .publishable_key | select(length>0 and (test("[\\r\\n]")|not))' "$RUNNER_TEMP/service.json")
          printf 'NUVIO_SUPABASE_URL=https://api.nuvio.tv\nNUVIO_SUPABASE_ANON_KEY=%s\n' "$key" > local.properties
          bash gradlew --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:assembleFullRelease :app:testFullReleaseUnitTest --tests '*OfficialTrailerDirectoryTest' --tests '*StreamAutoPlaySelectorTest'
          mapfile -t apks < <(find app/build/outputs/apk/full/release -name '*.apk')
          [[ ${#apks[@]} == 1 ]]
          cp "${apks[0]}" ../candidate.apk
      - uses: actions/upload-artifact@v4
        with: {name: tv-candidate, path: candidate.apk}
  release:
    needs: [select, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CODE: ${{ needs.select.outputs.code }}
      VERSION: ${{ needs.select.outputs.version }}
      APK: Nuvio-v2-TV-armeabi-v7a.apk
    steps:
      - uses: actions/download-artifact@v4
        with: {name: tv-candidate}
      - name: Verify Fire Stick package before signing
        run: |
          set -euo pipefail
          b="$ANDROID_HOME/build-tools/36.0.0"
          "$b/aapt" dump badging candidate.apk > package.txt
          grep -F "package: name='com.nakul.nuvio.smart.auto.tv' versionCode='$CODE' versionName='$VERSION'" package.txt
          grep -Fx "native-code: 'armeabi-v7a'" package.txt
          grep -q 'leanback-launchable-activity:' package.txt
          unzip -Z1 candidate.apk | grep -E '^lib/armeabi-v7a/libmpv\.so$' > /dev/null
      - name: Sign and verify TV APK
        env:
          STORE: ${{ secrets.NUVIO_STORE_B64 }}
          STOREPASS: ${{ secrets.NUVIO_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/tv-release.p12"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$STORE" | base64 -d > "$key"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" sign --ks "$key" --ks-pass env:STOREPASS --out "$APK" candidate.apk
          "$signer" verify --print-certs "$APK" | grep -Fx 'Signer #1 certificate SHA-256 digest: ed8bbd033a867b7f43b5f19c11fb7658272819ef0195962d320466db6bb70745'
      - name: Publish verified TV beta
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.select.outputs.tag }}
        run: |
          set -euo pipefail
          zip -q -0 "Nuvio_v2_TV_$CODE.zip" "$APK"
          gh release create "tv-v$VERSION" "$APK" "Nuvio_v2_TV_$CODE.zip" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Nuvio v2 TV • $UPSTREAM_TAG • Fire Stick build $CODE" --notes "Based on official NuvioTV $UPSTREAM_TAG. Signed 32-bit ARM update for Nuvio v2 TV."
